version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hale_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hale_dev
    ports:
      - "5432:5432"
    volumes:
      - hale_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hale_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hale_pgdata:

